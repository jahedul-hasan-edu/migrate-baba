[package]
name = "mb-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
futures-util = "0.3.34"
native-tls = "0.2.18"
percent-encoding = "2.3.2"
postgres-native-tls = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-postgres = "0.7.18"
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
