[package]
name = "mb-app"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
mb-core = { version = "0.1.0", path = "../mb-core" }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
